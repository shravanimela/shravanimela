<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>श्रावणी मेला 2026 | देवघर</title>

<meta name="description"
content="हर हर महादेव | देवघर झारखंड | श्रावणी मेला 2026">

<style>

/* ================================
   BASIC RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 50% 20%, #7b2d00 0%, transparent 35%),
        linear-gradient(180deg, #130500, #2b0900 45%, #080000);
}


/* ================================
   BACKGROUND PARTICLES
================================ */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        radial-gradient(circle, rgba(255,180,60,.45) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.25) 1px, transparent 1px);

    background-size: 55px 55px, 90px 90px;

    animation: particles 15s linear infinite;

    pointer-events: none;
}

@keyframes particles {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-120px);
    }
}


/* ================================
   MAIN CONTAINER
================================ */

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 20px 15px 40px;
    position: relative;
    z-index: 2;
}


/* ================================
   TOP BADGE
================================ */

.badge {
    display: inline-block;

    padding: 8px 16px;

    border: 1px solid rgba(255,255,255,.25);

    background: rgba(255,255,255,.08);

    border-radius: 50px;

    font-size: 13px;

    backdrop-filter: blur(10px);

    margin-bottom: 20px;
}


/* ================================
   HERO SECTION
================================ */

.hero {
    text-align: center;
    padding-top: 20px;
}

.trishul {
    font-size: 65px;

    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        filter: drop-shadow(0 0 5px #ff8c00);
    }

    to {
        filter: drop-shadow(0 0 30px #ff4500);
    }
}


.hero h1 {
    font-size: clamp(42px, 12vw, 70px);

    margin-top: 10px;

    font-weight: 900;

    background: linear-gradient(
        180deg,
        #fff,
        #ffd27a,
        #ff6a00
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 30px rgba(255,100,0,.3);
}


.subtitle {
    font-size: 19px;

    margin-top: 12px;

    letter-spacing: 2px;

    color: #ffd9a0;
}

.location {
    margin-top: 8px;

    font-size: 15px;

    opacity: .85;
}


/* ================================
   DIVIDER
================================ */

.divider {
    width: 100px;
    height: 3px;

    margin: 22px auto;

    background: linear-gradient(
        90deg,
        transparent,
        #ff9800,
        transparent
    );
}


/* ================================
   MUSIC CARD
================================ */

.music-card {

    margin-top: 25px;

    padding: 22px;

    border-radius: 28px;

    background: rgba(255,255,255,.09);

    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.4);

}


/* ================================
   MUSIC ICON
================================ */

.album {

    width: 90px;
    height: 90px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 42px;

    background:
        radial-gradient(
            circle,
            #ffcc80,
            #ff6d00 45%,
            #8b1a00
        );

    box-shadow:
        0 0 35px rgba(255,100,0,.45);

    animation: rotateDisc 10s linear infinite;

    animation-play-state: paused;
}

.album.playing {
    animation-play-state: running;
}

@keyframes rotateDisc {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ================================
   SONG INFO
================================ */

.song-title {

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;
}

.song-number {

    text-align: center;

    font-size: 13px;

    opacity: .6;

    margin-top: 6px;
}


/* ================================
   PROGRESS
================================ */

.progress-container {

    margin-top: 25px;

}

.progress {

    width: 100%;

    height: 6px;

    appearance: none;

    border-radius: 10px;

    background: rgba(255,255,255,.2);

    cursor: pointer;

}

.progress::-webkit-slider-thumb {

    appearance: none;

    width: 16px;

    height: 16px;

    border-radius: 50%;

    background: #ff9800;

    box-shadow: 0 0 10px #ff6d00;

}

.time {

    display: flex;

    justify-content: space-between;

    font-size: 11px;

    opacity: .65;

    margin-top: 6px;

}


/* ================================
   PLAYER BUTTONS
================================ */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    margin-top: 22px;

}

.control {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.12);

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition: .2s;

}

.control:active {

    transform: scale(.9);

}

.play {

    width: 65px;
    height: 65px;

    font-size: 27px;

    background:
        linear-gradient(
            135deg,
            #ffb300,
            #ff5e00
        );

    box-shadow:
        0 0 25px rgba(255,100,0,.5);

}


/* ================================
   VOLUME
================================ */

.volume {

    margin-top: 20px;

    display: flex;

    align-items: center;

    gap: 10px;

}

.volume input {

    flex: 1;

    accent-color: #ff9800;

}


/* ================================
   PLAYLIST
================================ */

.playlist-title {

    margin-top: 28px;

    font-size: 17px;

    font-weight: bold;

}

.playlist {

    margin-top: 12px;

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.track {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    border-radius: 15px;

    background: rgba(255,255,255,.06);

    border: 1px solid transparent;

    cursor: pointer;

    transition: .2s;

}

.track:hover {

    background: rgba(255,255,255,.12);

}

.track.active {

    background: rgba(255,120,0,.15);

    border-color: rgba(255,150,0,.4);

}

.track-number {

    width: 30px;

    text-align: center;

    opacity: .6;

}

.track-name {

    flex: 1;

    font-size: 14px;

}

.track-icon {

    font-size: 18px;

}


/* ================================
   FOOTER
================================ */

.footer {

    text-align: center;

    margin-top: 30px;

    font-size: 12px;

    opacity: .55;

    line-height: 1.8;

}


/* ================================
   MOBILE
================================ */

@media(max-width: 380px) {

    .container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .music-card {
        padding: 17px;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- TOP -->

    <div class="hero">

        <div class="badge">
            🔱 बाबा बैद्यनाथ धाम 🔱
        </div>

        <div class="trishul">
            🔱
        </div>

        <h1>
            हर हर महादेव
        </h1>

        <div class="subtitle">
            श्रावणी मेला 2026
        </div>

        <div class="location">
            📍 देवघर, झारखंड
        </div>

        <div class="divider"></div>

    </div>



    <!-- MUSIC PLAYER -->

    <div class="music-card">


        <div class="album" id="album">
            🕉️
        </div>


        <div class="song-title" id="songTitle">
            भक्ति संगीत
        </div>


        <div class="song-number" id="songNumber">
            गाना 1 / 10
        </div>


        <!-- AUDIO -->

        <audio id="audio"></audio>


        <!-- PROGRESS -->

        <div class="progress-container">

            <input
                type="range"
                class="progress"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>



        <!-- CONTROLS -->

        <div class="controls">


            <button
                class="control"
                id="prevBtn"
            >
                ⏮
            </button>


            <button
                class="control play"
                id="playBtn"
            >
                ▶
            </button>


            <button
                class="control"
                id="nextBtn"
            >
                ⏭
            </button>


        </div>



        <!-- VOLUME -->

        <div class="volume">

            <span>
                🔊
            </span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>



        <!-- PLAYLIST -->

        <div class="playlist-title">
            🎵 भोलेनाथ भक्ति संगीत
        </div>


        <div
            class="playlist"
            id="playlist"
        ></div>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        🔱 हर हर महादेव 🔱

        <br>

        बाबा बैद्यनाथ की कृपा सभी पर बनी रहे।

        <br>

        श्रावणी मेला 2026 • देवघर, झारखंड

    </div>


</div>



<script>

const songs = [

    {
        title: "भोलेनाथ भजन 01",
        file: "./music/song1.mp3"
    },

    {
        title: "भोलेनाथ भजन 02",
        file: "./music/song2.mp3"
    }

];


const audio = document.getElementById("audio");

const playBtn = document.getElementById("playBtn");

const prevBtn = document.getElementById("prevBtn");

const nextBtn = document.getElementById("nextBtn");

const progress = document.getElementById("progress");

const volume = document.getElementById("volume");

const songTitle = document.getElementById("songTitle");

const songNumber = document.getElementById("songNumber");

const playlist = document.getElementById("playlist");

const album = document.getElementById("album");

const currentTime = document.getElementById("currentTime");

const duration = document.getElementById("duration");


let currentSong = 0;


/* =========================
   LOAD SONG
========================= */

function loadSong(index) {

    currentSong = index;

    audio.src = songs[index].file;

    audio.load();

    songTitle.textContent =
        songs[index].title;

    songNumber.textContent =
        "गाना " + (index + 1) + " / " + songs.length;

    progress.value = 0;

    updatePlaylist();
}


/* =========================
   PLAY SONG
========================= */

function playSong() {

    audio.play()
        .then(function () {

            playBtn.textContent = "⏸";

            album.classList.add("playing");

        })
        .catch(function (error) {

            console.log("Audio error:", error);

        });

}


/* =========================
   PAUSE SONG
========================= */

function pauseSong() {

    audio.pause();

    playBtn.textContent = "▶";

    album.classList.remove("playing");

}


/* =========================
   PLAY / PAUSE BUTTON
========================= */

playBtn.addEventListener(
    "click",
    function () {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    }
);


/* =========================
   NEXT SONG
========================= */

nextBtn.addEventListener(
    "click",
    function () {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   PREVIOUS SONG
========================= */

prevBtn.addEventListener(
    "click",
    function () {

        currentSong--;

        if (currentSong < 0) {

            currentSong =
                songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   AUTOMATIC NEXT SONG
========================= */

audio.addEventListener(
    "ended",
    function () {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   PROGRESS BAR
========================= */

audio.addEventListener(
    "timeupdate",
    function () {

        if (audio.duration) {

            progress.value =
                (audio.currentTime /
                audio.duration) * 100;

        }

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


/* =========================
   SONG DURATION
========================= */

audio.addEventListener(
    "loadedmetadata",
    function () {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =========================
   PROGRESS SEEK
========================= */

progress.addEventListener(
    "input",
    function () {

        if (audio.duration) {

            audio.currentTime =
                (progress.value / 100) *
                audio.duration;

        }

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    function () {

        audio.volume =
            volume.value;

    }
);


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds) {

    if (!isFinite(seconds)) {

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsLeft =
        Math.floor(seconds % 60);

    return minutes + ":" +
        String(secondsLeft).padStart(2, "0");

}


/* =========================
   CREATE PLAYLIST
========================= */

function createPlaylist() {

    playlist.innerHTML = "";

    songs.forEach(
        function (song, index) {

            const track =
                document.createElement("div");

            track.className = "track";

            track.innerHTML = `

                <div class="track-number">
                    ${index + 1}
                </div>

                <div class="track-name">
                    ${song.title}
                </div>

                <div class="track-icon">
                    🎵
                </div>

            `;

            track.addEventListener(
                "click",
                function () {

                    loadSong(index);

                    playSong();

                }
            );

            playlist.appendChild(track);

        }
    );

}


/* =========================
   UPDATE PLAYLIST
========================= */

function updatePlaylist() {

    const tracks =
        document.querySelectorAll(".track");

    tracks.forEach(
        function (track, index) {

            if (index === currentSong) {

                track.classList.add("active");

            } else {

                track.classList.remove("active");

            }

        }
    );

}


/* =========================
   INITIAL SETUP
========================= */

audio.volume = 0.8;

createPlaylist();

loadSong(0);

</script>
